
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: vigneshgorakala
  password: 
  host: localhost
  port: 5432


development:
  <<: *default
  database: excel_development

test:
  <<: *default
  database: excel_test


production:
  primary: &primary_production
    <<: *default
    database: excel_production
    username: excel
    password: <%= ENV["EXCEL_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: excel_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: excel_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: excel_production_cable
    migrations_paths: db/cable_migrate
